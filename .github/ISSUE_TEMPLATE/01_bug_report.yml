name: Bug report
description: Report a bug in one of the apps in this pack.
labels: ["type/bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! This tracker is for the **apps** in this pack.
        For bugs in the Unleashed firmware itself, please use the firmware repo instead.
  - type: input
    id: app
    attributes:
      label: App
      description: Which app is affected? (name as it appears in the app menu)
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: >
        The app's own version, not the firmware version. Read `fap_version` from
        the app's `application.fam` - in its folder in this repo, or in the app's
        folder on your microSD.
      placeholder: e.g. 1.4
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug.
      description: A clear and concise description of what goes wrong.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: How can this be reproduced?
      placeholder: |
        1. Open the app...
        2. Press '...'
        3. See the issue
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Firmware version
      description: Which Unleashed firmware version are you running?
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any logs or other text output here.
      # Rendered as a code block so logs arrive intact instead of being reflowed
      # as Markdown. This is the only field with `render`: it also disables file
      # attachments, which is a fair trade for logs but not for anything else -
      # hence the separate catch-all below, where photos of the screen can go.
      render: Text
  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Screenshots, photos of the Flipper screen, or anything else that helps.
